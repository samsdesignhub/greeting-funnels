<title>AI Business Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef0fa; --bg-2:#e5e7f6; --surface:#ffffff; --surface-2:#f7f7fd; --surface-3:#f0f0fb;
  --line:#e2e4f2; --line-2:#d2d5ec;
  --ink:#1a1c3b; --ink-2:#555a7f; --ink-3:#868aab;
  --accent:#5a4cf2; --accent-2:#7d6fff; --accent-ink:#ffffff; --accent-soft:#eeecff; --accent-line:#cbc5ff; --accent-text:#4a3ee0;
  --good:#16805a; --good-soft:#e2f4eb; --warn:#9a6208; --warn-soft:#fcf0d9; --bad:#c2364e; --bad-soft:#fce7eb; --info:#2c68cf; --info-soft:#e4edfc;
  --shadow:0 1px 2px rgba(30,32,80,.05),0 6px 20px rgba(70,70,160,.06);
  --shadow-lg:0 20px 60px rgba(30,30,90,.22);
  --r-lg:16px; --r:12px; --r-sm:8px;
  --font:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0f1f; --bg-2:#14152a; --surface:#171930; --surface-2:#1c1e38; --surface-3:#22244a;
    --line:#2a2d4f; --line-2:#383c66;
    --ink:#eceefe; --ink-2:#aeb1d6; --ink-3:#7c80a8;
    --accent:#7f72ff; --accent-2:#9a8fff; --accent-ink:#ffffff; --accent-soft:#25234d; --accent-line:#433d86; --accent-text:#b3abff;
    --good:#4cc792; --good-soft:#15332a; --warn:#e3a94a; --warn-soft:#3a2d14; --bad:#f07288; --bad-soft:#3d1a24; --info:#7aa7f5; --info-soft:#1a2745;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0f1f; --bg-2:#14152a; --surface:#171930; --surface-2:#1c1e38; --surface-3:#22244a;
  --line:#2a2d4f; --line-2:#383c66;
  --ink:#eceefe; --ink-2:#aeb1d6; --ink-3:#7c80a8;
  --accent:#7f72ff; --accent-2:#9a8fff; --accent-ink:#ffffff; --accent-soft:#25234d; --accent-line:#433d86; --accent-text:#b3abff;
  --good:#4cc792; --good-soft:#15332a; --warn:#e3a94a; --warn-soft:#3a2d14; --bad:#f07288; --bad-soft:#3d1a24; --info:#7aa7f5; --info-soft:#1a2745;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent-text)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(90,76,242,.35)}
.brand-name{font-weight:800;font-size:15px;line-height:1.15}
.brand-sub{font-size:11.5px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13.5px;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.nav .ico{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;font-family:var(--mono);background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:0 7px}
.nav button.on .count{background:var(--surface);color:var(--accent-text)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.status-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

.main-col{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,var(--surface))}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px 9px 36px;outline:none}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
#main{flex:1;overflow-y:auto;padding:24px 28px 48px}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800}
.page-head p{color:var(--ink-2);max-width:640px;margin-top:4px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:700}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 14px rgba(90,76,242,.28)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn svg{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent-line);color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line)}
.tag.accent{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-line)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.sref{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:6px;padding:1px 6px;cursor:pointer}
.sref:hover{background:var(--surface)}
.sref.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent;cursor:help;text-decoration:line-through}
.linkbtn{background:none;border:none;padding:0;color:var(--accent-text);font-weight:600;cursor:pointer;font-size:12.5px}
.linkbtn:hover{text-decoration:underline}

label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink)}
label.f .hint{font-weight:500;color:var(--ink-3);font-size:11.5px}
.input,.textarea,.select{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:9px 12px;outline:none;font-weight:500;font-size:13.5px}
.textarea{resize:vertical;min-height:84px;line-height:1.5}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface-2)}
.empty h4{color:var(--ink);font-size:14px}
.empty p{max-width:460px;font-size:13px}
.note{font-size:12.5px;border-radius:10px;padding:10px 12px;background:var(--info-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.divider{height:1px;background:var(--line);margin:4px 0}
.seg{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent-text);box-shadow:0 1px 3px rgba(20,20,60,.1)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px}

/* ---------- markdown ---------- */
.md{font-size:14px;line-height:1.62;color:var(--ink)}
.md>*+*{margin-top:9px}
.md h1,.md h2,.md h3,.md h4{font-size:14.5px;font-weight:800;margin-top:14px}
.md ul,.md ol{padding-left:20px;margin:0}
.md li+li{margin-top:3px}
.md blockquote{margin:0;border-left:3px solid var(--accent-line);padding:2px 12px;color:var(--ink-2)}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--surface-3);padding:1px 5px;border-radius:5px}
.md pre{background:var(--surface-3);padding:10px 12px;border-radius:10px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md hr{border:none;border-top:1px solid var(--line)}

/* ---------- coach ---------- */
.hello{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.hello h1{font-size:28px;font-weight:800}
.hello p{color:var(--ink-2);margin-top:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.coach-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:520px}
.chat-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-h .select{width:auto;max-width:260px;padding:6px 10px;font-size:12.5px}
.log{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:88%}
.msg.user{align-self:flex-end}
.msg.user .bubble{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px 14px 4px 14px;padding:10px 14px;white-space:pre-wrap}
.msg.coach{align-self:flex-start}
.msg.coach .bubble{padding:2px 0}
.msg-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-3)}
.coach-av{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;flex:none}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--ink-3);font-size:13px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.suggest{border:1px solid var(--accent-line);background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.composer textarea{border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;resize:none;min-height:54px;max-height:200px;outline:none}
.composer textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.intro{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:auto;text-align:left}
.intro h3{font-size:17px}
.starter{display:flex;flex-direction:column;gap:6px}
.starter button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:500}
.starter button:hover{border-color:var(--accent-line);background:var(--surface)}
.side-col{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.mini{display:flex;flex-direction:column;gap:8px}
.mini-item{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.ctx-sec{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ctx-sec:last-child{border-bottom:none}
.ctx-item{display:flex;flex-direction:column;gap:2px;font-size:12.5px;cursor:pointer;border-radius:8px;padding:6px 8px;margin:0 -8px}
.ctx-item:hover{background:var(--surface-2)}
.ctx-item b{font-weight:700;font-size:13px}

/* ---------- entities ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ecard{display:flex;flex-direction:column;gap:10px;padding:16px}
.ecard h4{font-size:15px;font-weight:700}
.ev-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sess-row{display:grid;grid-template-columns:62px minmax(0,1.6fr) minmax(0,1.4fr) 110px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.sess-row:hover{background:var(--surface-2)}
.sess-num{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent-text);background:var(--accent-soft);border-radius:8px;text-align:center;padding:4px 0}
.sess-title{font-weight:700}
.sess-stats{display:flex;gap:10px;font-size:11.5px;color:var(--ink-3);justify-content:flex-end;font-family:var(--mono)}
.two{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.pick{display:flex;flex-direction:column;gap:2px;padding:6px}
.pick button{text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pick button:hover{background:var(--surface-2)}
.pick button.on{background:var(--accent-soft);border-color:var(--accent-line)}
.pick b{font-size:13px;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:800;font-family:var(--mono)}
.commit{display:grid;grid-template-columns:minmax(0,1fr) 140px 130px auto;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.commit:last-child{border-bottom:none}
.commit .t{font-weight:600}
.commit.overdue .due{color:var(--bad);font-weight:700}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.steps button.done{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.steps button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pipe{display:flex;flex-direction:column;gap:2px}
.pipe-step{display:flex;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.pipe-step .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:10px}
.pipe-step.run .st{border-color:var(--accent);border-top-color:transparent;animation:spin .9s linear infinite}
.pipe-step.done .st{background:var(--good);border-color:var(--good);color:#fff}
.pipe-step.err .st{background:var(--bad);border-color:var(--bad);color:#fff}
.pipe-step.skip .st{background:var(--surface-3)}
.pipe-step.wait{color:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
.out{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 16px}
.reply{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.transcript{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:nowrap}
.tabs button{border:none;background:none;padding:10px 12px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent-text);border-bottom-color:var(--accent)}
.score{display:inline-flex;gap:2px}
.score button{width:26px;height:24px;border:1px solid var(--line-2);background:var(--surface);font-size:11px;font-family:var(--mono);cursor:pointer;border-radius:6px}
.score button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}

/* ---------- modal & toast ---------- */

<script>
"use strict";
/* =====================================================================
   AI BUSINESS COACH — V1
   Layers:
     Store     : entity collections (db capability → localStorage → memory)
     AI        : claude.use("sample") wrapper, never faked
     Index     : keyword/TF-IDF retrieval over every entity (swap for embeddings later)
     Engine    : coaching prompt builder, meta parsing, citation validation,
                 session import pipeline, pattern detection, review queue
     Views     : one render function per section
   ===================================================================== */

/* ---------------- constants ---------------- */
const COLS = ['context','methodology','intelligence','cases','frameworks','sessions','patterns','commitments','decisions','insights','beliefs','conversations','tests'];
const CATEGORIES = ['Business','Strategy','Execution','Decision-making','Content','Communication','Beliefs','Learning','Recurring behavior'];
const C_STATUS = ['Not Started','In Progress','Done','Blocked'];
const D_STATUS = ['Open','Exploring','Testing','Decided'];
const MODES = ['Explore','Diagnose','Challenge','Teach','Practice','Review','Decide','Reflect','Accountability','Follow-up'];
const EVAL_DIMS = [
  ['issue', 'Identified the real issue'], ['questions', 'Asked useful questions'], ['challenge', 'Challenged when appropriate'], ['restraint', 'Avoided unnecessary challenge'],
  ['teaching', 'Taught when appropriate'], ['evidence', 'Used evidence appropriately'], ['honesty', 'Did not pretend it appeared in a session'], ['general', 'Used general reasoning when needed'],
  ['consistency', 'Consistent with Coaching Intelligence'], ['original', 'Did not copy a session response']
];
const CHUNK = 36000;

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nowISO = () => new Date().toISOString();
const today = () => new Date().toISOString().slice(0, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const uniq = a => [...new Set((a || []).filter(Boolean))];
const arr = v => Array.isArray(v) ? v : (v == null || v === '' ? [] : [v]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const pad2 = n => String(n).padStart(2, '0');
const sref = s => s ? 'S' + pad2(s.number) : '';
const fmtDate = d => { if (!d) return ''; const x = new Date(d.length === 10 ? d + 'T00:00:00' : d); return isNaN(x) ? d : x.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let val;
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') val = v;

const ICONS = {
  coach: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 11h.01M13 11h.01M17 11h.01"/>',
  patterns: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="m8.2 7.3 7.5.3M16.6 10 10.6 16M6.5 8.5l1.8 7"/>',
  decisions: '<path d="M12 3v6"/><path d="M12 9 6 15v6M12 9l6 6v6"/>',
  sessions: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 13h8M8 16h5"/>',
  accountability: '<path d="m9 12 2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="4"/>',
  content: '<path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/>',
  social: '<path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 10h8"/>',
  beliefs: '<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/>',
  knowledge: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  send: '<path d="M4 12 20 4l-6 16-3-7-7-1Z"/>', upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 17v3h16v-3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16v4Z"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  wrap: '<path d="M5 12h14M12 5l7 7-7 7"/>'
};
const icon = (n, cls = '') => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); if (cls) s.setAttribute('class', cls); s.innerHTML = ICONS[n] || ''; return s; };

/* ---------------- Store ---------------- */
const LS_KEY = 'abc.store.v1';
const Store = {
  mode: 'memory', db: null, data: {}, ver: 0, listeners: new Set(),
  async init() {
    COLS.forEach(c => this.data[c] = new Map());
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (db) {
      this.db = db; this.mode = 'db';
      await new Promise(res => {
        let pending = COLS.length; const done = () => { if (--pending === 0) res(); };
        COLS.forEach(c => {
          let first = true;
          try {
            db.collection(c).onSnapshot(snap => {
              const m = new Map();
              snap.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
              this.data[c] = m; this.ver++;
              if (first) { first = false; done(); } else this.emit();
            }, err => { console.warn('db', c, err); if (first) { first = false; done(); } });
          } catch (e) { console.warn(e); if (first) { first = false; done(); } }
        });
        setTimeout(res, 9000);
      });
    } else {
      const raw = lsGet(LS_KEY);
      this.mode = lsSet('abc.probe', '1') ? 'local' : 'memory';
      if (raw) { try { const o = JSON.parse(raw); COLS.forEach(c => (o[c] || []).forEach(x => this.data[c].set(x.id, x))); } catch { } }
    }
  },
  emit() { this.ver++; this.listeners.forEach(f => f()); },
  persistLocal() { if (this.mode !== 'local') return; const o = {}; COLS.forEach(c => o[c] = [...this.data[c].values()]); if (!lsSet(LS_KEY, JSON.stringify(o))) toast('Browser storage is full. Export a backup from Knowledge → System.'); },
  all(c) { return [...(this.data[c] || new Map()).values()]; },
  get(c, id) { return id ? (this.data[c] || new Map()).get(id) : undefined; },
  async put(c, obj) {
    const o = clone(obj); o.updatedAt = nowISO(); if (!o.createdAt) o.createdAt = o.updatedAt;
    this.data[c].set(o.id, o); this.emit();
    if (this.db) { try { await this.db.doc(c + '/' + o.id).set(o); } catch (e) { handleDbError(e); throw e; } }
    else this.persistLocal();
    return o;
  },
  async patch(c, id, part) { const cur = this.get(c, id); if (!cur) return null; return this.put(c, { ...clone(cur), ...part }); },
  async del(c, id) {
    this.data[c].delete(id); this.emit();
    if (this.db) { try { await this.db.doc(c + '/' + id).delete(); } catch (e) { handleDbError(e); } } else this.persistLocal();
  },
  /* transcripts live outside the in-memory cache and load on demand (privacy + scale) */
  async putTranscript(sid, text) {
    const parts = []; for (let i = 0; i < text.length; i += 200000) parts.push(text.slice(i, i + 200000));
    if (this.db) {
      for (let i = 0; i < parts.length; i++) await this.db.doc('transcripts/' + sid + (i ? '.p' + i : '')).set({ sessionId: sid, part: i, parts: parts.length, text: parts[i] });
    } else if (this.mode === 'local') { if (!lsSet('abc.tx.' + sid, text)) toast('Transcript too large for browser storage; session saved without it.'); }
    else this.mem[sid] = text;
  },
  mem: {},
  async getTranscript(sid) {
    if (this.db) {
      const first = await this.db.doc('transcripts/' + sid).get(); if (!first.exists) return null;
      const d = first.data(); let t = d.text || '';
      for (let i = 1; i < (d.parts || 1); i++) { const p = await this.db.doc('transcripts/' + sid + '.p' + i).get(); if (p.exists) t += p.data().text || ''; }
      return t;
    }
    if (this.mode === 'local') return lsGet('abc.tx.' + sid);
    return this.mem[sid] || null;
  },
  async delTranscript(sid) {
    if (this.db) { const f = await this.db.doc('transcripts/' + sid).get(); const n = f.exists ? (f.data().parts || 1) : 1; for (let i = 0; i < n; i++) await this.db.doc('transcripts/' + sid + (i ? '.p' + i : '')).delete(); }
    else if (this.mode === 'local') { try { localStorage.removeItem('abc.tx.' + sid); } catch { } }
    else delete this.mem[sid];
  }
};
function handleDbError(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('Storage is full: ' + (e.message || 'delete old items or export a backup.'));
  else if (c === 'invalid_argument') toast('Save refused. You may only have view access to this coach.');
  else if (c === 'revoked') toast('Access to storage ended for this page load.');
  else toast('Could not save. Try again in a moment.');
}

/* ---------------- AI ---------------- */
const AI = {
  fn: null, off: false, reason: '',
  async init() {
    try { this.fn = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch { this.fn = null; }
    if (!this.fn) { this.off = true; this.reason = 'AI is not available in this view.'; }
  },
  ok() { return !!this.fn && !this.off; },
  handle(e) {
    const c = e && e.code;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { this.off = true; this.reason = 'AI access was declined or is unavailable in this view.'; renderChrome(); }
    const copy = {
      cancelled: '', rate_limited: 'Too many requests right now. Wait a minute and try again.', session_expired: 'Your Claude session expired. Sign in again, then retry.',
      refused: 'Claude declined this request. Rephrase it and try again.', empty_completion: 'No answer came back. Try asking for less at once.',
      invalid_json: 'The answer came back in the wrong shape. Try again.', prompt_too_large: 'Too much text for one request. Shorten the input.',
      not_granted: 'AI access was declined for this page.', sampling_disabled: 'AI is disabled for this account.'
    };
    return c in copy ? copy[c] : 'The AI request failed. Try again.';
  },
  async text(input, o = {}) { if (!this.ok()) throw { code: 'not_granted', message: this.reason }; return this.fn(input, { cache: false, ...o }); },
  async json(input, o = {}) { if (!this.ok()) throw { code: 'not_granted', message: this.reason }; return this.fn.json(input, { cache: false, ...o }); }

/* ---------------- Index (retrieval) ---------------- */
const STOP = new Set('the and for that this with you your are was were have has had not but they them their what when where which who why how can could would should will just about into from there here then than too very really also some any all our out get got like its it’s i’m i’ve dont don’t can’t cant want need more most much make made does did doing been being one two sam’s sam session sessions coach me my mine myself we us'.split(' '));
function tokens(s) {
  return (String(s || '').toLowerCase().match(/[a-z0-9][a-z0-9'’-]{2,}/g) || [])
    .map(t => t.replace(/['’]s$/, '').replace(/(ing|ed|es|s)$/, m => (t.length > 5 ? '' : m)))
    .filter(t => t.length > 2 && !STOP.has(t));

const Index = {
  ver: -1, docs: [], df: new Map(),
  fields(type, o) {
    switch (type) {
      case 'sessions': return [[o.title, 3], [(o.topics || []).join(' '), 3], [(o.categories || []).join(' '), 2], [o.summary, 2], [o.keyLesson, 2], [[...arr(o.problems), ...arr(o.beliefs), ...arr(o.assumptions), ...arr(o.insights), ...arr(o.frameworks), ...arr(o.decisions), ...arr(o.commitments), ...arr(o.possiblePatterns)].join(' '), 1]];
      case 'patterns': return [[o.name, 3], [o.category, 2], [o.description, 2]];
      case 'frameworks': return [[o.name, 3], [arr(o.steps).join(' '), 1], [o.whenToUse, 2]];
      case 'commitments': return [[o.text, 3], [o.reason, 1], [o.learning, 1], [o.result, 1]];
      case 'decisions': return [[o.title, 3], [arr(o.options).join(' '), 2], [[o.outcome, o.assumptions, o.evidence, o.risks, o.finalChoice].join(' '), 1]];
      case 'methodology': return [[o.title, 3], [o.body, 1], [o.when, 1]];
      case 'context': return [[o.label, 2], [o.value, 1]];
      case 'beliefs': return [[o.belief, 3], [Object.values(o.steps || {}).join(' '), 1]];
      case 'insights': return [[o.title, 3], [o.body, 1]];
      case 'intelligence': return [[o.name, 3], [o.principle, 2], [o.trigger, 1]];
      default: return [];
    }
  },
  build() {
    if (this.ver === Store.ver) return;
    this.docs = []; this.df = new Map();
    ['sessions', 'patterns', 'frameworks', 'commitments', 'decisions', 'methodology', 'context', 'beliefs', 'intelligence'].forEach(type => {
      Store.all(type).forEach(o => {
        const tf = new Map();
        this.fields(type, o).forEach(([txt, w]) => tokens(txt).forEach(t => tf.set(t, (tf.get(t) || 0) + w)));
        this.docs.push({ type, id: o.id, tf });
        tf.forEach((_, t) => this.df.set(t, (this.df.get(t) || 0) + 1));
      });
    });
    this.ver = Store.ver;
  },
  search(q, { types, limit = 8, min = 0.5 } = {}) {
    this.build();

};
function retrieve(q) {
  const r = t => Index.search(q, { types: [t], limit: t === 'sessions' ? 6 : 4 }).map(x => Store.get(t, x.id)).filter(Boolean);
  return { sessions: r('sessions'), patterns: r('patterns'), frameworks: r('frameworks'), commitments: r('commitments'), decisions: r('decisions') };
}

/* ---------------- confidence ---------------- */
function liveSessionIds(ids) { return uniq(ids).filter(id => Store.get('sessions', id)); }
function patternConf(p) {
  const n = liveSessionIds(p.sessionIds).length;
  if (p.status === 'dismissed') return { key: 'dismissed', label: 'Dismissed', level: '—', cls: 'neutral', n };
  if (n === 0) return { key: 'unknown', label: 'Unknown · no evidence', level: 'None', cls: 'neutral', n };
  if (n === 1) return { key: 'possible', label: 'Possible pattern', level: 'Low', cls: 'warn', n };
  if (p.status === 'confirmed' && n >= 3) return { key: 'confirmed', label: 'Confirmed', level: 'High', cls: 'good', n };

/* =====================================================================
   COACHING INTELLIGENCE (Layer 1)
   Learned HOW-to-coach principles, synthesised across sessions. Stored in
   `intelligence`; representative situation→response cases in `cases`.
   Kept strictly apart from historical context about Sam (Layer 3).
   ===================================================================== */
const CI_DIMS = [
  ['thinking', 'Thinking patterns', 'how the coach analyses a situation: what she notices first, what she questions, how she prioritises information, identifies the real issue, separates facts from interpretations and reasons from evidence'],
  ['diagnostic', 'Diagnostic patterns', 'how she diagnoses problems: the actual recurring sequence she uses to get from a presented symptom to the real issue'],
  ['questioning', 'Questioning patterns', 'the types of questions she asks, when and why, what she is trying to uncover, how she follows up on answers, and when she stops questioning and starts teaching'],
  ['challenge', 'Challenge patterns', 'what makes her challenge, how she challenges unsupported assumptions and contradictions, how direct she is, when she pushes deeper and when she does NOT challenge'],
  ['teaching', 'Teaching patterns', 'when she teaches, how she explains, examples, analogies, frameworks, sequencing, how she checks understanding and moves from explanation to application'],
  ['feedback', 'Feedback patterns', 'how she responds when the client is wrong, partially correct, misunderstands, gives a weak or strong answer, avoids the question or changes direction'],
  ['decision', 'Decision-coaching patterns', 'how she helps the client think through choices, uncertainty, risks, assumptions, trade-offs, consequences, experiments and next steps'],
  ['belief', 'Belief & assumption patterns', 'how she handles beliefs, assumptions, fears, predictions, interpretations and limiting conclusions (without labelling every negative statement a limiting belief)'],
  ['style', 'Response style', 'observable communication characteristics: conversational vs formal, direct vs indirect, length, questioning vs explaining, challenging vs reassuring, practical vs conceptual, use of examples, repetition, analogies, pacing, emotional tone'],

- Some principles were learned in group trainings. Apply them only as they transfer to this private one-to-one conversation: diagnose Sam's own situation, never talk to him as an audience.
- History is a possible parallel, not a diagnosis: say how the current situation might differ, and never let an old situation replace asking about this one.

TRANSLATING THE COACH'S LIVE STYLE TO WRITTEN CHAT
- The learned style comes from spoken, face-to-face sessions. Keep the intent, not the mannerisms: at most one short understanding check ("does that fit?") after an explanation, never a string of "Right? Correct?".

- Reply in the language Sam writes in. Dictate exact wording only when he is writing a script, copy or a message.
- Never promise or guarantee results.

NATURAL VOICE

- Adaptive loop: listen → understand → question → diagnose → identify assumptions → teach/challenge → apply → correct → practise → extract pattern → action → accountability → review. Never force every stage.
- Modes (silently choose one): Explore, Diagnose, Challenge, Teach, Practice, Review, Decide, Reflect, Accountability, Follow-up.
- Diagnose before advising: what happened, what Sam thinks happened, the symptom, the real problem, possible causes, assumptions, what he wants. Business areas include traffic, audience, positioning, messaging, offer, pricing, conversion, follow-up, funnel structure, customer journey, tracking, execution.
- Question-first when Sam may already know; 1–3 questions at a time; answer simple factual questions directly.
- Challenge only with evidence (unsupported assumption, rationalisation, avoidance, contradiction, repeated unproductive behaviour, symptom focus, desire mistaken for evidence); respectful directness. Don't challenge to sound like a coach.
- Teaching: assess understanding → gap → explain → example → Sam applies → correct and explain why → new scenario → principle → exercise. Practice raises difficulty gradually.
- Reviewing work: what works, what's unclear/missing/weak, why, what to change; ask Sam to fix it first where useful.
- Decisions: improve his thinking, don't decide for him. Reflection on personal behaviour: no mental-health diagnoses, no claims about hidden motives. Commitments are done only when Sam says so.

- Don't guess at motives ("that's the comfortable answer", "it's easier than…"); ask instead.

async function exportBackup() {
  const o = { app: 'ai-business-coach', version: 1, exportedAt: nowISO() }; COLS.forEach(c => o[c] = Store.all(c));
  const json = JSON.stringify(o, null, 2);
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { }
  if (!dl) { openModal({ title: 'Backup JSON', sub: 'Downloads are not available here. Copy the text instead.', body: h('textarea', { class: 'textarea mono', rows: 16, readonly: true, value: json }) }); return; }
  try { await dl.save({ filename: `coach-backup-${today()}.json`, data: json }); } catch (e) { if (e && e.code !== 'cancelled' && e.code !== 'declined') toast('Download did not complete.'); }
}
async function restoreBackup(file) {
  if (!file) return;
  try {
    const o = JSON.parse(await file.text()); if (o.app !== 'ai-business-coach') throw new Error('Not a coach backup file.');
    let n = 0; for (const c of COLS) for (const x of arr(o[c])) if (x && x.id) { await Store.put(c, x); n++; }
    toast(`Restored ${n} items`);
  } catch (e) { toast(e.message || 'Could not read that file.'); }
}

/* =====================================================================
   GLOBAL SEARCH
   ===================================================================== */
const SEARCH_TYPES = { intelligence: 'Coaching Intelligence', sessions: 'Sessions', patterns: 'Patterns', frameworks: 'Frameworks', commitments: 'Commitments', decisions: 'Decisions', methodology: 'Methodology', context: 'Context', beliefs: 'Beliefs' };
function openSearchItem(type, id) {
  const o = Store.get(type, id); if (!o) return;
  modalStack.slice().forEach(m => m.close());
  if (type === 'sessions') openSession(id); else if (type === 'patterns') openPattern(id); else if (type === 'frameworks') openFramework(o);
  else if (type === 'commitments') openCommitment(o); else if (type === 'decisions') go('decisions', { decId: id, decDraft: null });
  else if (type === 'methodology') editMethod(o); else if (type === 'intelligence') editIntelligence(o); else if (type === 'context') editContext(o); else if (type === 'beliefs') go('beliefs', { beliefId: id, beliefDraft: null, beliefStep: 0 });
}
function itemTitle(type, o) { return type === 'sessions' ? `${sref(o)} · ${o.title}` : o.name || o.title || o.text || o.label || o.belief || o.id; }
function runSearch(q) {
  q = q.trim(); if (!q) return;
  const hits = Index.search(q, { limit: 30, min: 0.3 });
  let aiState = null;
  const m = openModal({ title: 'Search', sub: `“${q}”`, wide: true, body: () => draw(), actions: [] });
  function draw() {
    const groups = {}; hits.forEach(x => (groups[x.type] = groups[x.type] || []).push(x));
    return [
      h('div', { class: 'row' }, h('span', { class: 'small muted grow' }, `${plural(hits.length, 'keyword match')}`), aiButton(aiState === 'busy' ? 'Searching…' : 'Ask AI to search by meaning', aiSearch, 'btn sm')),
      aiState && aiState !== 'busy' ? h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h3', null, 'AI results'), h('span', { class: 'tiny faint' }, 'only existing items are shown')), aiState.length ? h('div', { class: 'list' }, aiState.map(r => h('div', { class: 'li click', onclick: () => openSearchItem(r.type, r.id) }, h('span', { class: 'tag' }, SEARCH_TYPES[r.type]), h('div', { class: 'grow' }, h('b', null, itemTitle(r.type, Store.get(r.type, r.id))), h('div', { class: 'small muted' }, r.why))))) : h('div', { class: 'pad small muted' }, 'Nothing relevant found.')) : null,
      Object.keys(groups).length ? Object.entries(groups).map(([t, xs]) => h('div', { class: 'card' }, h('div', { class: 'card-h' }, h('h3', null, SEARCH_TYPES[t]), h('span', { class: 'tiny faint' }, xs.length)), h('div', { class: 'list' }, xs.map(x => { const o = Store.get(t, x.id); return h('div', { class: 'li click', onclick: () => openSearchItem(t, x.id) }, h('div', { class: 'grow' }, h('b', null, itemTitle(t, o)), h('div', { class: 'small muted' }, trunc(o.summary || o.description || o.body || o.value || o.reason || arr(o.steps).join(' → ') || '', 150)))); }))))
        : h('p', { class: 'muted small' }, 'No keyword matches. Try the AI search, which matches by meaning.')
    ];
  }
  async function aiSearch() {
    aiState = 'busy'; m.setBody(draw());
    const idx = []; let used = 0;
    for (const t of Object.keys(SEARCH_TYPES)) for (const o of Store.all(t)) { const line = `${t}|${o.id}|${trunc(itemTitle(t, o), 80)}|${trunc(o.summary || o.description || o.body || o.value || arr(o.problems).join('; ') || '', 220)}`; if (used + line.length > 48000) break; idx.push(line); used += line.length; }
    try {
      const r = await AI.json(`Find the items in Sam's private knowledge base that answer this request: "${q}". Only return ids from the index. Reply with only JSON {"results":[{"type":"","id":"","why":"one short line"}]} with at most 10 results, best first, or an empty list.\nINDEX (type|id|title|text):\n${idx.join('\n')}`, { modelTier: 'quick' });
      aiState = arr(r.results).filter(x => x && SEARCH_TYPES[x.type] && Store.get(x.type, x.id));
    } catch (e) { toast(AI.handle(e)); aiState = null; }
    m.setBody(draw());
  }
}
