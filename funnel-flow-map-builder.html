<title>Funnel Flow Map Builder</title>
<meta name="description" content="Visualize your funnel before you build it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F4FB; --band:#ECEEFB; --surface:#FFFFFF; --surface-2:#F7F8FD; --surface-3:#EFF1F9;
  --line:#E3E6F1; --line-2:#EDEFF7; --ink:#1C2038; --ink-2:#434866; --muted:#71769A;
  --primary:#5B5CF0; --primary-600:#4A4BDD; --primary-soft:#EEEFFE; --primary-line:#CBCDFB; --on-primary:#FFFFFF;
  --success:#2F9E62; --success-soft:#E3F4EA; --warn:#C27A0E; --warn-soft:#FDF3E1; --danger:#DC2645; --danger-soft:#FDECEF;
  --shadow-sm:0 1px 2px rgba(28,32,80,.05);
  --shadow:0 1px 2px rgba(28,32,80,.04),0 10px 30px rgba(28,32,80,.07);
  --shadow-lg:0 20px 60px rgba(20,24,70,.18);
  --radius:16px; --radius-sm:10px;
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --side-w:292px; --panel-w:316px;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{width:18px;height:18px;flex:none;display:block}
.i-sm{width:15px;height:15px}
.i-lg{width:22px;height:22px}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}

/* ---------- Header ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--band);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:none}
.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4F63F5,#7A4CF0);box-shadow:0 8px 20px rgba(91,92,240,.35);flex:none}
.logo .i{width:22px;height:22px}
.brand-text{min-width:0}
.brand-text h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.brand-text p{margin:2px 0 0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapmeta{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 0;justify-content:center;overflow:hidden}
.mapname{border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 10px;font-weight:700;font-size:14px;min-width:0;max-width:300px;width:100%;text-align:center;text-overflow:ellipsis}
.mapname:hover{border-color:var(--line);background:var(--surface)}
.mapname:focus{border-color:var(--primary-line);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.savestate{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--success)}
.savestate.dirty::before{background:var(--warn)}
.actions{display:flex;align-items:center;gap:8px;flex:none}
.bgroup{display:flex;align-items:center;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 12px;border-radius:9px;border:0;background:transparent;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--surface-3);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:transparent}
.btn.icon{width:34px;padding:0}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px rgba(91,92,240,.3);height:42px;padding:0 16px;border-radius:12px}
.btn.primary:hover{background:var(--primary-600)}
.btn.outline{border:1px solid var(--line);background:var(--surface)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.block{width:100%}
.zoomval{min-width:50px;font-variant-numeric:tabular-nums;font-size:12.5px}
.only-md,.only-sm{display:none!important}

/* ---------- Work area ---------- */
#work{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--panel-w);min-height:0;position:relative}

/* ---------- Sidebar ---------- */
#sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.side-head{padding:14px 16px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line-2)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--surface-3);padding:3px;border-radius:11px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface-2);color:var(--muted)}
.search input{border:0;background:transparent;outline:none;padding:9px 0;width:100%;font-size:13px;color:var(--ink)}
.search:focus-within{border-color:var(--primary-line);box-shadow:0 0 0 3px var(--primary-soft)}
.side-body{overflow-y:auto;padding:8px 12px 16px;flex:1;min-height:0}
.side-foot{padding:10px 16px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.side-foot a,.credit a{color:var(--primary);font-weight:700;text-decoration:none}
.side-foot a:hover,.credit a:hover{text-decoration:underline}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 8px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-title span{font-weight:600;letter-spacing:0;text-transform:none}
.hint-line{font-size:12px;color:var(--muted);margin:0 4px 10px;line-height:1.45}
.fcard{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 11px;margin-bottom:7px;transition:border-color .15s,box-shadow .15s,transform .15s}
.fcard:hover{border-color:var(--primary-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.fcard b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.fcard small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.fic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary)}
.fic .i{width:18px;height:18px}
.tpl .fic{background:linear-gradient(135deg,#4F63F5,#7A4CF0);color:#fff}
.badge{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--success-soft);color:var(--success);margin-left:6px;vertical-align:1px}
details.cat{margin-bottom:4px}
details.cat>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 4px;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-radius:8px}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary .dot{width:8px;height:8px;border-radius:3px;background:var(--c)}
details.cat>summary .cnt{margin-left:auto;font-weight:600;letter-spacing:0}
details.cat>summary .chev{transition:transform .15s}
details.cat[open]>summary .chev{transform:rotate(90deg)}
.lib-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;border:1px solid transparent;cursor:grab;user-select:none;position:relative}
.lib-item:hover{background:var(--surface-2);border-color:var(--line)}
.lib-item:active{cursor:grabbing}
.lib-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.lib-ic .i{width:17px;height:17px}
.lib-text{flex:1;min-width:0}
.lib-text b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-text small{display:block;font-size:11px;color:var(--muted)}
.grip{color:var(--muted);opacity:.55}
.lib-item:hover .grip{opacity:1}
.lib-del{position:absolute;right:30px;border:0;background:var(--surface);border-radius:6px;padding:3px;color:var(--muted);display:none}
.lib-item:hover .lib-del{display:block}
.lib-del:hover{color:var(--danger)}
.addcustom{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:8px 0 6px;padding:10px;border-radius:12px;border:1.5px dashed var(--primary-line);background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13px}
.addcustom:hover{border-style:solid}
.gcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:7px;border-left:4px solid var(--c);cursor:grab}
.gcard:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 45%,var(--line));border-left-color:var(--c)}
.gcard b{font-size:13px;display:block;margin-bottom:3px}
.gcard small{font-size:11.5px;color:var(--muted);line-height:1.4;display:block}
.empty-lib{padding:24px 8px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- Canvas ---------- */
#canvasWrap{position:relative;overflow:hidden;min-width:0;min-height:0;touch-action:none;background-color:#F8F9FD}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#stage.tool-hand,#stage.panning{cursor:grab}
#stage.panning:active{cursor:grabbing}
#stage.tool-connect,#stage.tool-text{cursor:crosshair}
#stage [data-ref^="n:"]{cursor:move}
#stage.tool-connect [data-ref^="n:"]{cursor:crosshair}
#stage [data-part="head"]{cursor:move}
#stage [data-ref^="e:"]{cursor:pointer}
#stage [data-ref^="e:"]:hover .eline{stroke-width:3}
#stage [data-h="port"]{cursor:crosshair}
#stage [data-h="resize-n"],#stage [data-h="resize-g"]{cursor:nwse-resize}
#stage [data-h="collapse"]{cursor:pointer}
#stage.drop-target{outline:3px dashed var(--primary-line);outline-offset:-6px}

.floatbar{position:absolute;display:flex;align-items:center;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:10}
.toolbar{top:14px;left:50%;transform:translateX(-50%)}
.tbtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:52px;height:46px;padding:0 6px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-size:10.5px;font-weight:600}
.tbtn:hover{background:var(--surface-3);color:var(--ink)}
.tbtn.active{background:var(--primary-soft);color:var(--primary)}
.tbtn.sq{min-width:36px;width:36px}
.tsep{width:1px;height:28px;background:var(--line);margin:0 5px}
.selbar{top:76px;left:50%;transform:translateX(-50%);padding:4px}
.selbar .lbl{font-size:12px;font-weight:700;color:var(--muted);padding:0 8px;white-space:nowrap}
.selbar .btn{height:32px}
.selbar .btn.icon{width:32px}
.chip-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:99px;z-index:11;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.minimap{position:absolute;right:16px;bottom:16px;width:196px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:9}
.minimap-head{display:flex;align-items:center;justify-content:space-between;padding:5px 6px 5px 10px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-2)}
.minimap-head button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:2px}
.minimap canvas{display:block;width:196px;height:124px;cursor:pointer;touch-action:none}
.minimap.min canvas{display:none}
.minimap.min .minimap-head{border-bottom:0}
.credit{position:absolute;left:16px;bottom:16px;z-index:9;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;box-shadow:var(--shadow-sm)}
.empty{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none;padding:16px}
.empty-card{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:34px 32px;max-width:440px;text-align:center}
.empty-art{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4F63F5,#7A4CF0);box-shadow:0 12px 30px rgba(91,92,240,.35)}
.empty-art .i{width:30px;height:30px}
.empty h2{margin:0 0 8px;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.empty p{margin:0 0 22px;color:var(--muted);line-height:1.5}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- Panel ---------- */
#panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.panel-head{display:flex;align-items:center;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--line-2)}
.panel-head .hic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.panel-head h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.panel-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.panel-head .x{margin-left:auto}
#panelBody{overflow-y:auto;flex:1;min-height:0}
.psec{padding:14px 18px;border-bottom:1px solid var(--line-2);display:grid;gap:12px}
.psec h4{margin:0;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.flabel span{color:var(--muted);font-weight:500;font-size:11.5px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--primary-line);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.seg{display:flex;gap:2px;padding:3px;background:var(--surface-3);border-radius:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 6px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range{display:flex;align-items:center;gap:10px}
.range input[type=range]{flex:1;accent-color:var(--primary)}
.range .num{width:64px;text-align:right;padding:7px 8px;font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.colorrow{display:flex;align-items:center;gap:8px}
.colorrow input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.bgopts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bgopt{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 3px 6px;display:grid;gap:5px;justify-items:center;font-size:10.5px;font-weight:600;color:var(--muted)}
.bgopt i{display:block;width:100%;height:28px;border-radius:6px;border:1px solid var(--line)}
.bgopt.on{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.toggle input{appearance:none;width:36px;height:21px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;cursor:pointer;flex:none}
.toggle input::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle input:checked{background:var(--primary)}
.toggle input:checked::after{transform:translateX(15px)}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px;max-height:196px;overflow-y:auto;padding:2px}
.icongrid button{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icongrid button:hover{border-color:var(--primary-line);color:var(--primary)}
.icongrid button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;border:1px solid var(--line);background:var(--surface)}
.btnrow .btn:hover{background:var(--surface-3)}
.alignrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.alignrow .btn{border:1px solid var(--line);background:var(--surface);width:auto;height:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chips button:hover{border-color:var(--primary-line);color:var(--primary)}
.mlist{display:grid;gap:4px}
.mlist button{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:6px 8px;font-size:12.5px;font-weight:600;text-align:left}
.mlist button:hover{border-color:var(--primary-line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.stat small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.stat b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px;color:var(--muted)}
.keys kbd{font-family:inherit;font-size:11px;font-weight:700;background:var(--surface-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink-2);white-space:nowrap;justify-self:start}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(16,18,40,.45);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(900px,100%)}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px}
.modal-head h2{margin:0;font-size:18px;letter-spacing:-.01em}
.modal-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.modal-head .btn{margin-left:auto}
.modal-body{padding:4px 22px 18px;overflow-y:auto;min-height:0}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-foot .btn{height:40px;padding:0 16px;border-radius:11px}
.modal-foot .btn.outline:hover{background:var(--surface-3)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tgrid .fcard{margin:0}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px}
.picklist .lib-item{cursor:pointer;border:1px solid var(--line-2)}
.export-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
.preview{border:1px solid var(--line);border-radius:14px;min-height:220px;display:grid;place-items:center;padding:12px;background-color:var(--surface-2);background-image:linear-gradient(45deg,var(--surface-3) 25%,transparent 25%,transparent 75%,var(--surface-3) 75%),linear-gradient(45deg,var(--surface-3) 25%,transparent 25%,transparent 75%,var(--surface-3) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.preview canvas{max-width:100%;max-height:340px;border-radius:6px;box-shadow:var(--shadow);display:block}
.dims{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.maplist{display:grid;gap:8px}
.mapitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mapitem .meta{flex:1;min-width:0}
.mapitem b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapitem small{color:var(--muted);font-size:12px}
.err{color:var(--danger);font-size:12px;font-weight:600}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:grid;gap:8px;z-index:200;justify-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#1C2038;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .2s ease-out;max-width:100%}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700;font-size:12px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.scrim{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1560px){.mapname{display:none}}
@media (max-width:1320px){
  .btn .lbl{display:none}
  .btn.primary .lbl{display:inline}
  .bgroup .btn:not(.icon){width:34px;padding:0}
}
@media (max-width:1180px){
  #work{grid-template-columns:var(--side-w) minmax(0,1fr)}
  #panel{position:absolute;top:0;right:0;bottom:0;width:min(var(--panel-w),92vw);transform:translateX(105%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  #panel.open{transform:none}
  .only-md{display:inline-flex!important}
  .mapmeta .savestate{display:none}
}
@media (max-width:860px){
  :root{--side-w:300px}
  .topbar{flex-wrap:wrap;gap:10px;padding:10px 16px}
  .brand{flex:1 1 auto}
  .brand-text h1{white-space:normal}
  .brand-text h1{font-size:16.5px}
  .brand-text p{font-size:11.5px}
  .logo{width:38px;height:38px}
  .mapmeta{display:none}
  .actions{order:3;width:100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .actions::-webkit-scrollbar{display:none}
  .only-sm{display:inline-flex!important}
  #work{grid-template-columns:minmax(0,1fr)}
  #sidebar{position:absolute;top:0;left:0;bottom:0;width:min(var(--side-w),88vw);transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  #sidebar.open{transform:none}
  .scrim.show{display:block;position:absolute;inset:0;background:rgba(16,18,40,.3);z-index:25}
  .toolbar{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tbtn{min-width:44px;font-size:9.5px}
  .selbar{top:10px;max-width:calc(100% - 20px);overflow-x:auto}
  .minimap{display:none}
  .credit{top:10px;bottom:auto;left:10px;font-size:11px;padding:4px 10px}
  .selbar:not([hidden]) ~ .credit{display:none}
  .chip-hint{bottom:78px}
  .export-grid{grid-template-columns:1fr}
  #toasts{bottom:84px}
}
@media (max-width:520px){
  .tbtn span{display:none}
  .tbtn{height:40px;min-width:38px}
  .toolbar .tsep{margin:0 2px}
}

      </div>
      <div class="scrim" id="scrim"></div>
    </section>

    <aside id="panel" aria-label="Settings">

    </aside>
  </main>
</div>

/* =====================================================================
   PERSISTENCE
   ===================================================================== */
let autoT = null;
function changed() { renderChrome(); scheduleAutosave(); }
function scheduleAutosave() { clearTimeout(autoT); autoT = setTimeout(() => lsSet(LS.auto, { doc: snapshot(), view, savedId, savedSnap, emptyDismissed }), 350); }
const isDirty = () => !!(doc.nodes.length || doc.groups.length) && savedSnap !== snapshot();
function saveMap(then) {
  const maps = lsGet(LS.maps, []), snap = snapshot(), now = Date.now(), name = doc.settings.title.trim() || "Untitled Funnel";
  let m = savedId && maps.find(x => x.id === savedId);
  if (m) Object.assign(m, { name, doc: snap, updated: now }); else { m = { id: uid("m"), name, doc: snap, updated: now }; maps.unshift(m); }
  if (!lsSet(LS.maps, maps)) { toast("Couldn't save. This browser is blocking or out of local storage."); return false; }
  savedId = m.id; savedSnap = snap; changed(); toast(`Saved “${name}” in this browser`);
  if (typeof then === "function") then();
  return true;
}
function guardUnsaved(next) {
  if (!isDirty()) { next(); return; }
  openModal({ title: "Save your changes first?", sub: `“${doc.settings.title}” has changes that aren't saved.`, body: `<p class="note">Save keeps a copy you can open later from Load Map. Your work is also kept if you refresh this page.</p>`,
    foot: [{ label: "Cancel", fn: closeModal }, { label: "Discard changes", cls: "outline danger", fn: () => { closeModal(); next(); } }, { label: "Save & continue", cls: "primary", fn: () => { closeModal(); if (saveMap()) next(); } }] });
}
function newMap() {

}
function loadSample(withHistory) {

  const apply = () => { const b = layoutDef(def, { x: 0, y: 0 }, doc.settings.direction); doc.nodes = b.nodes; doc.edges = b.edges; doc.groups = b.groups; doc.settings.title = def.title; clearSel(); };
  if (withHistory) mutate(apply); else apply();
}
function resetMap() {
  openModal({ title: "Reset to the sample funnel?", sub: "This replaces the canvas with the High-Ticket Coaching example.", body: `<p class="note">Your map style settings are reset too. You can undo this with Ctrl/⌘ Z.</p>`,
    foot: [{ label: "Cancel", fn: closeModal }, { label: "Reset map", cls: "primary", fn: () => { closeModal(); mutate(() => { doc.settings = DEFAULT_SETTINGS(); }); loadSample(true); savedId = null; savedSnap = null; emptyDismissed = false; changed(); requestAnimationFrame(() => fitView()); toast("Map reset", { action: "Undo", fn: undo }); } }] });
}
function loadModal() {
  const maps = lsGet(LS.maps, []);
  const fmt = t => new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const body = maps.length ? `<div class="maplist">${maps.map(m => { let c = 0; try { c = JSON.parse(m.doc).nodes.filter(n => n.kind === "step").length; } catch {} return `<div class="mapitem"><div class="fic">${iconSVG("filter")}</div><div class="meta"><b>${esc(m.name)}</b><small>${c} steps · saved ${fmt(m.updated)}${m.id === savedId ? " · open now" : ""}</small></div><button class="btn outline danger" data-delmap="${m.id}">Delete</button><button class="btn primary" style="height:36px" data-openmap="${m.id}">Open</button></div>`; }).join("")}</div>`
    : `<div class="empty-lib">No saved maps yet.<br>Use <b>Save Map</b> to keep a copy in this browser.</div>`;
  openModal({ title: "Load a saved map", sub: "Maps are stored in this browser only.", body });
  $("#modalBody").addEventListener("click", e => {
    const o = e.target.closest("[data-openmap]"), d = e.target.closest("[data-delmap]");
    if (o) { const m = lsGet(LS.maps, []).find(x => x.id === o.dataset.openmap); if (!m) return; closeModal(); guardUnsaved(() => { mutate(() => restore(m.doc)); savedId = m.id; savedSnap = snapshot(); clearSel(); changed(); renderAll(true); requestAnimationFrame(() => fitView()); toast(`Opened “${m.name}”`); }); }
    if (d) { if (d.dataset.confirm) { lsSet(LS.maps, lsGet(LS.maps, []).filter(x => x.id !== d.dataset.delmap)); if (savedId === d.dataset.delmap) { savedId = null; savedSnap = null; changed(); } closeModal(); loadModal(); toast("Saved map deleted"); } else { d.dataset.confirm = "1"; d.textContent = "Confirm delete"; } }
  });
}

/* =====================================================================
   EXPORT
   ===================================================================== */
let dlCap = null;
try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d => { dlCap = d; }).catch(() => {}); } catch {}
const exp = { format: "png", scale: 2, bg: "current", scope: "all" };
function exportPlan() {
  const S = doc.settings, b = exp.scope === "view" ? viewRect() : contentBounds(); if (!b) return null;
  const dark = (exp.bg === "current" && S.bg === "dark"), showT = S.showTitle && S.title.trim();
  const pad = exp.scope === "view" ? 0 : 56, tH = showT ? 86 : 0;
  const rect = { x: b.x - pad, y: b.y - pad - tH, w: b.w + pad * 2, h: b.h + pad * 2 + tH };
  const bgMode = exp.bg === "current" ? S.bg : exp.bg === "white" ? "white" : (exp.format === "jpg" ? "white" : null);
  const back = bgMode ? bgItems(rect, bgMode) : [];
  const title = showT ? [{ t: "text", x: rect.x + Math.max(pad, 32), y: rect.y + Math.max(pad, 32) + 12, s: "FUNNEL MAP", size: 11, weight: 800, fill: dark ? mix(S.primary, "#ffffff", .35) : S.primary, ls: 1.6 }, { t: "text", x: rect.x + Math.max(pad, 32), y: rect.y + Math.max(pad, 32) + 48, s: S.title.trim(), size: 30, weight: 800, fill: dark ? "#F1F2FA" : "#1C2038", ls: -.4 }] : [];
  return { rect, back, title, ents: buildScene(null) };
}
function rasterize(plan, scale) {
  const { rect } = plan; let s = scale;
  while ((rect.w * s > 16000 || rect.h * s > 16000 || rect.w * rect.h * s * s > 1.2e8) && s > .25) s *= .8;
  const cv = document.createElement("canvas"); cv.width = Math.ceil(rect.w * s); cv.height = Math.ceil(rect.h * s);
  const ctx = cv.getContext("2d"); ctx.scale(s, s); ctx.translate(-rect.x, -rect.y);
  if (exp.format === "jpg" && !plan.back.length) { ctx.fillStyle = "#fff"; ctx.fillRect(rect.x, rect.y, rect.w, rect.h); }
  drawItems(ctx, plan.back, s); plan.ents.forEach(e => drawItems(ctx, e.items, s)); drawItems(ctx, plan.title, s);
  cv._scale = s; return cv;
}
function svgString(plan) {
  const { rect } = plan, all = [...plan.back, ...plan.ents.flatMap(e => e.items), ...plan.title];
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(rect.w)}" height="${Math.ceil(rect.h)}" viewBox="${r2(rect.x)} ${r2(rect.y)} ${r2(rect.w)} ${r2(rect.h)}" font-family='${FONT}'>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');text{font-family:${FONT.replace(/"/g, "'")}}</style>
<filter id="fxCard" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1E2360" flood-opacity=".09"/></filter>
<filter id="fxSoft" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E2360" flood-opacity=".08"/></filter></defs>
${all.map(i => itemSVG(i, true)).join("\n")}
</svg>`;
}
const slug = s => (s || "funnel-map").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "funnel-map";
function exportModal() {
  if (!contentBounds()) { toast("Add some steps before exporting"); return; }
  const S = doc.settings;
  const body = `<div class="export-grid"><div><div class="preview" id="expPrev"></div><div class="dims" id="expDims"></div></div>
  <div style="display:grid;gap:14px;align-content:start">
    <div class="field"><label for="expName">Funnel name</label><input id="expName" class="inp" value="${esc(S.title)}" maxlength="80"></div>
    <label class="toggle">Show funnel title <input type="checkbox" id="expShow" ${S.showTitle ? "checked" : ""}></label>
    <div class="field"><span class="flabel">Format</span><div class="seg" data-k="format">${[["png", "PNG"], ["jpg", "JPG"], ["svg", "SVG"]].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="field"><span class="flabel">Resolution</span><div class="seg" data-k="scale">${[[1, "1x"], [2, "2x"], [3, "3x"]].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="field"><span class="flabel">Background</span><div class="seg" data-k="bg">${[["current", "Current"], ["white", "White"], ["transparent", "Transparent"]].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</div></div>
    <div class="field"><span class="flabel">Area</span><div class="seg" data-k="scope">${[["all", "Entire funnel"], ["view", "Visible area"]].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</div></div>
    <p class="note" id="expNote"></p>
  </div></div>`;
  openModal({ title: "Export Image", sub: "Only the funnel map is exported: no toolbars or panels.", wide: true, body,
    foot: [{ label: "Cancel", fn: closeModal }, { label: iconSVG("download") + `<span id="expGoLbl">Export Entire Funnel</span>`, cls: "primary", id: "expGo", fn: doExport }] });
  const sync = () => {
    $$("#modalBody .seg[data-k]").forEach(sg => { const k = sg.dataset.k; $$("button", sg).forEach(b => { b.classList.toggle("on", String(exp[k]) === b.dataset.v); b.disabled = (k === "scale" && exp.format === "svg") || (k === "bg" && b.dataset.v === "transparent" && exp.format === "jpg"); }); });
    $("#expGoLbl").textContent = exp.scope === "all" ? "Export Entire Funnel" : "Export Visible Area";
    $("#expNote").textContent = exp.format === "svg" ? "SVG is a vector file: it stays sharp at any size and opens in Figma, Illustrator and browsers." : exp.format === "jpg" && exp.bg === "transparent" ? "JPG can't be transparent, so a white background is used." : exp.bg === "transparent" ? "Transparent PNG works well on slides and documents." : "PNG is best for slides, docs and sharing.";
    const plan = exportPlan(); if (!plan) return;
    const box = $("#expPrev"), maxW = Math.max(200, box.clientWidth - 24), fit = Math.min(maxW / plan.rect.w, 340 / plan.rect.h);
    const cv = rasterize(plan, fit * (window.devicePixelRatio || 1)); cv.style.width = Math.round(plan.rect.w * fit) + "px"; cv.style.height = Math.round(plan.rect.h * fit) + "px";
    box.innerHTML = ""; box.appendChild(cv);
    const sc = exp.format === "svg" ? 1 : exp.scale;
    $("#expDims").textContent = exp.format === "svg" ? `${Math.ceil(plan.rect.w)} × ${Math.ceil(plan.rect.h)} vector · ${doc.nodes.filter(n => n.kind === "step").length} steps` : `${Math.ceil(plan.rect.w * sc).toLocaleString()} × ${Math.ceil(plan.rect.h * sc).toLocaleString()} px · ${exp.format.toUpperCase()}`;
  };
  $("#modalBody").addEventListener("click", e => { const b = e.target.closest(".seg[data-k] button"); if (!b || b.disabled) return; const k = b.closest(".seg").dataset.k; exp[k] = k === "scale" ? +b.dataset.v : b.dataset.v; if (exp.format === "jpg" && exp.bg === "transparent") exp.bg = "white"; sync(); });
  $("#expName").addEventListener("input", e => { doc.settings.title = e.target.value; clearTimeout(exportModal.t); exportModal.t = setTimeout(sync, 200); renderChrome(); });
  $("#expShow").addEventListener("change", e => { doc.settings.showTitle = e.target.checked; sync(); });
  const pre = snapshot(); modalOnClose = () => { pushHistory(pre); renderAll(true); };
  requestAnimationFrame(sync);
}
async function doExport() {
  const plan = exportPlan(); if (!plan) return;
  const name = `${slug(doc.settings.title)}.${exp.format}`; let blob, cv = null;
  try {
    if (exp.format === "svg") blob = new Blob([svgString(plan)], { type: "image/svg+xml" });
    else { cv = rasterize(plan, exp.scale); blob = await new Promise(r => cv.toBlob(r, exp.format === "jpg" ? "image/jpeg" : "image/png", .95)); if (cv._scale < exp.scale) toast("This map is very large, so the resolution was reduced to fit browser limits."); }
  } catch (err) { toast("Export failed: the map is too large for this browser. Try 1x or the visible area."); return; }
  if (!blob) { toast("Export failed. Try a lower resolution."); return; }
  if (dlCap) {
    try { await dlCap.save({ filename: name, data: blob }); closeModal(); toast(`Exported ${name}`); return; }
    catch (err) { if (err && err.code === "declined") { toast("Export cancelled"); return; } if (err && err.code === "rate_limited") { toast("A save prompt is already open"); return; } }
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
  if (cv) { const box = $("#expPrev"); if (box) { const pw = box.querySelector("canvas"); cv.style.width = pw?.style.width || "100%"; cv.style.height = pw?.style.height || "auto"; box.innerHTML = ""; box.appendChild(cv); } }
  const note = $("#expNote"); if (note) note.innerHTML = `<b>Download started: ${esc(name)}.</b> If nothing downloaded, right-click the preview and choose “Save image as”. The preview is now full resolution.`;
  toast(`Exporting ${name}`);
}

/* =====================================================================
   TOASTS
   ===================================================================== */
function toast(msg, opts = {}) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  if (opts.action) { const b = document.createElement("button"); b.textContent = opts.action; b.addEventListener("click", () => { opts.fn(); t.remove(); }); t.appendChild(b); }
  const box = $("#toasts"); box.appendChild(t); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), opts.ms || 3200);
}

(function init() {
  const saved = lsGet(LS.auto, null);
